<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151826">
<title>MI DAW</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{--bg:#151826;--panel:#1e2236;--line:#2c3250;--text:#e8eaf6;--mut:#8f95b8;--play:#ff5c7a;--amber:#ffb454;--bar:96px;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:44px;min-width:44px;padding:0 14px}
button:active{background:var(--line)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mut{color:var(--mut);font-size:13px}
.top{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
#proj-name{flex:1;text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dirty #proj-name::after{content:" •";color:var(--amber)}
.transport{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.btns{display:flex;gap:8px}
#btn-play[aria-pressed=true]{background:var(--play);border-color:var(--play);color:#1a0b10}
#btn-pause[aria-pressed=true]{border-color:var(--amber);color:var(--amber)}
.readout{text-align:right;font-variant-numeric:tabular-nums}
.readout b{display:block;font-size:26px;font-weight:600;line-height:1.1}
.readout span{color:var(--mut);font-size:13px}
.tempo{grid-column:1/-1;display:flex;gap:6px;align-items:center}
#bpm{width:84px;min-height:44px;text-align:center;font:inherit;font-weight:600;font-size:18px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px}
#btn-metro{margin-left:auto}
#btn-metro[aria-pressed=true]{border-color:var(--amber);color:var(--amber)}
#timeline{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden}
#tl-inner{position:relative;height:100%;display:flex;flex-direction:column}
#ruler{display:flex;height:40px;flex:none;touch-action:none;background:var(--panel);border-bottom:1px solid var(--line);cursor:col-resize}
.bar{flex:0 0 var(--bar);border-left:1px solid var(--line);padding:4px 6px;font-size:12px;color:var(--mut);
 background:repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px) bottom/100% 8px no-repeat}
.lanes{flex:1;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px var(--bar))}
.empty{position:sticky;left:16px;display:inline-block;margin:20px 16px;color:var(--mut);max-width:70vw}
#playhead{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--play);pointer-events:none;will-change:transform}
dialog{margin:auto;width:min(92vw,420px);max-height:85vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:16px}
dialog::backdrop{background:rgba(5,6,12,.7)}
dialog h2{font-size:18px;margin-bottom:12px}
#form-new{display:flex;gap:8px;margin-bottom:12px}
#new-name{flex:1;min-width:0;min-height:44px;padding:0 10px;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;user-select:text}
#plist{list-style:none;padding:0;margin-bottom:12px;display:grid;gap:8px}
#plist li{display:flex;gap:8px}
#plist .open{flex:1;text-align:left;overflow:hidden}
#plist .open small{display:block;color:var(--mut)}
#plist .none{color:var(--mut)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <button id="proj-name" aria-label="Abrir lista de proyectos">Proyecto</button>
  <button id="btn-save">Guardar</button>
</header>
<section class="transport">
  <div class="btns">
    <button id="btn-stop" aria-label="Detener">■</button>
    <button id="btn-play" aria-label="Reproducir" aria-pressed="false">▶</button>
    <button id="btn-pause" aria-label="Pausa" aria-pressed="false">❚❚</button>
  </div>
  <div class="readout"><b id="pos">001.1.1</b><span id="time">00:00.0</span></div>
  <div class="tempo">
    <button id="bpm-down" aria-label="Bajar BPM">−</button>
    <input id="bpm" type="number" inputmode="numeric" min="20" max="300" value="120" aria-label="BPM">
    <button id="bpm-up" aria-label="Subir BPM">+</button>
    <span class="mut">BPM</span>
    <button id="btn-metro" aria-pressed="true">Metrónomo</button>
  </div>
</section>
<main id="timeline">
  <div id="tl-inner">
    <div id="ruler" aria-label="Regla de compases: toca o arrastra para mover el cursor"></div>
    <div class="lanes"><p class="empty">Aún no hay pistas. Se añaden en la etapa 2.</p></div>
    <div id="playhead"></div>
  </div>
</main>
<dialog id="dlg-projects">
  <h2>Proyectos</h2>
  <form id="form-new">
    <input id="new-name" type="text" placeholder="Nombre del proyecto nuevo" maxlength="60" aria-label="Nombre del proyecto nuevo">
    <button type="submit">Crear</button>
  </form>
  <ul id="plist"></ul>
  <button id="dlg-close">Cerrar</button>
</dialog>
<dialog id="dlg-confirm">
  <form method="dialog">
    <p id="confirm-msg"></p>
    <div class="row"><button value="cancel">Cancelar</button><button value="ok">Aceptar</button></div>
  </form>
</dialog>
<script>/** Funciones puras de tiempo y tempo (sin audio ni DOM, fáciles de probar). */
function clampBpm(v, fallback = 120) {
  const n = Math.round(Number(v));
  return Number.isFinite(n) ? Math.min(300, Math.max(20, n)) : fallback;
}
/** Posición "compás.tiempo.subdivisión" (subdivisión = semicorchea, 1-4). */
function formatPosition(beat, beatsPerBar = 4) {
  const b = Math.max(0, beat) + 1e-9;
  const bar = Math.floor(b / beatsPerBar) + 1;
  const inBar = Math.floor(b % beatsPerBar) + 1;
  const sub = Math.floor((b % 1) * 4) + 1;
  return String(bar).padStart(3, '0') + '.' + inBar + '.' + sub;
}
function formatTime(seconds) {
  const tenths = Math.floor(Math.max(0, seconds) * 10 + 1e-6);
  const p = n => String(n).padStart(2, '0');
  return p(Math.floor(tenths / 600)) + ':' + p(Math.floor((tenths % 600) / 10)) + '.' + (tenths % 10);
}

/** Modelo de proyecto. Las etapas siguientes añadirán pistas, clips y mezcla aquí. */
function createProject(name) {
  const now = Date.now();
  const id = (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'p' + now + Math.random().toString(36).slice(2, 8);
  return { id, name: (name || '').trim() || 'Proyecto sin título', bpm: 120, bars: 16, beatsPerBar: 4, createdAt: now, updatedAt: now, version: 1 };
}

/** Guardado local (localStorage). Los audios grandes irán a IndexedDB en etapas posteriores. */
const IDX = 'midaw.index', PFX = 'midaw.project.', LAST = 'midaw.last';
const readIndex = () => { try { return JSON.parse(localStorage.getItem(IDX)) || []; } catch { return []; } };
function listProjects() { return readIndex().sort((a, b) => b.updatedAt - a.updatedAt); }
function saveProject(p) {
  p.updatedAt = Date.now();
  localStorage.setItem(PFX + p.id, JSON.stringify(p));
  const idx = readIndex().filter(x => x.id !== p.id);
  idx.push({ id: p.id, name: p.name, updatedAt: p.updatedAt });
  localStorage.setItem(IDX, JSON.stringify(idx));
  localStorage.setItem(LAST, p.id);
}
function loadProject(id) {
  try { const p = JSON.parse(localStorage.getItem(PFX + id)); if (p) localStorage.setItem(LAST, id); return p; } catch { return null; }
}
function deleteProject(id) {
  localStorage.removeItem(PFX + id);
  localStorage.setItem(IDX, JSON.stringify(readIndex().filter(x => x.id !== id)));
  if (localStorage.getItem(LAST) === id) localStorage.removeItem(LAST);
}
function lastProjectId() { return localStorage.getItem(LAST); }

/** Transporte: reloj de reproducción y metrónomo con Web Audio (programación con anticipación). */
class Transport {
  constructor(createContext) {
    this.createContext = createContext || (() => new (window.AudioContext || window.webkitAudioContext)());
    this.ctx = null; this.state = 'stopped'; this.bpm = 120; this.beatsPerBar = 4; this.totalBeats = 64;
    this.posBeats = 0; this.metronome = true; this.onState = () => {};
  }
  configure({ bpm, beatsPerBar, totalBeats }) { this.bpm = bpm; this.beatsPerBar = beatsPerBar; this.totalBeats = totalBeats; this.posBeats = 0; }
  currentBeat() {
    if (this.state !== 'playing') return this.posBeats;
    return Math.min(this.totalBeats, this.anchorBeat + Math.max(0, this.ctx.currentTime - this.anchorTime) * this.bpm / 60);
  }
  async play() {
    if (this.state === 'playing') return;
    if (!this.ctx) this.ctx = this.createContext();
    await this.ctx.resume();
    if (this.posBeats >= this.totalBeats) this.posBeats = 0;
    this._anchor(this.posBeats, 0.05);
    this.state = 'playing';
    this.timer = setInterval(() => this.tick(), 25);
    this.onState(this.state);
  }
  pause() {
    if (this.state !== 'playing') return;
    this.posBeats = this.currentBeat(); this._halt('paused');
  }
  stop() { this.posBeats = 0; this._halt('stopped'); }
  _halt(state) { clearInterval(this.timer); this.state = state; this.onState(state); }
  _anchor(beat, delay) { this.anchorBeat = beat; this.anchorTime = this.ctx.currentTime + delay; this.nextBeat = Math.ceil(beat - 1e-9); }
  setBpm(v) {
    if (this.state === 'playing') this._anchor(this.currentBeat(), 0);
    this.bpm = v;
  }
  seek(beat) {
    const b = Math.min(this.totalBeats, Math.max(0, beat));
    if (this.state === 'playing') this._anchor(b, 0.02); else this.posBeats = b;
  }
  tick() {
    const horizon = this.ctx.currentTime + 0.12;
    while (this.nextBeat < this.totalBeats) {
      const t = this.anchorTime + (this.nextBeat - this.anchorBeat) * 60 / this.bpm;
      if (t > horizon) break;
      if (this.metronome) this._click(Math.max(t, this.ctx.currentTime), this.nextBeat % this.beatsPerBar === 0);
      this.nextBeat++;
    }
    if (this.currentBeat() >= this.totalBeats) this.stop();
  }
  _click(t, accent) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.value = accent ? 1600 : 1000;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + 0.06);
  }
}


const $ = s => document.querySelector(s);
const BAR_PX = 96;
const transport = new Transport();
let project, dirty = false;

function setDirty(v) { dirty = v; document.body.classList.toggle('dirty', v); }

function buildTimeline() {
  const r = $('#ruler'); r.replaceChildren();
  for (let i = 1; i <= project.bars; i++) { const d = document.createElement('div'); d.className = 'bar'; d.textContent = i; r.append(d); }
  $('#tl-inner').style.width = project.bars * BAR_PX + 'px';
  $('#timeline').scrollLeft = 0;
}

function render() {
  if (!project) return;
  const b = transport.currentBeat(), x = b / project.beatsPerBar * BAR_PX, tl = $('#timeline');
  $('#pos').textContent = formatPosition(b, project.beatsPerBar);
  $('#time').textContent = formatTime(b * 60 / project.bpm);
  $('#playhead').style.transform = 'translateX(' + x + 'px)';
  if (transport.state === 'playing' && (x > tl.scrollLeft + tl.clientWidth * 0.85 || x < tl.scrollLeft)) tl.scrollLeft = Math.max(0, x - tl.clientWidth * 0.15);
}
function loop() { render(); if (transport.state === 'playing') requestAnimationFrame(loop); }

transport.onState = s => {
  $('#btn-play').setAttribute('aria-pressed', s === 'playing');
  $('#btn-pause').setAttribute('aria-pressed', s === 'paused');
  if (s === 'stopped') $('#timeline').scrollLeft = 0;
  loop();
};

function openProject(p) {
  project = p; transport.stop();
  transport.configure({ bpm: p.bpm, beatsPerBar: p.beatsPerBar, totalBeats: p.bars * p.beatsPerBar });
  $('#proj-name').textContent = p.name; $('#bpm').value = p.bpm;
  buildTimeline(); setDirty(false); render();
}
function newProject(name) { const p = createProject(name); saveProject(p); openProject(p); }

function setBpm(v) {
  v = clampBpm(v, project.bpm); project.bpm = v; transport.setBpm(v);
  $('#bpm').value = v; setDirty(true); render();
}

$('#btn-play').onclick = () => transport.play();
$('#btn-pause').onclick = () => transport.pause();
$('#btn-stop').onclick = () => transport.stop();
$('#bpm-down').onclick = () => setBpm(project.bpm - 1);
$('#bpm-up').onclick = () => setBpm(project.bpm + 1);
$('#bpm').onchange = e => setBpm(e.target.value);
$('#btn-metro').onclick = e => { transport.metronome = !transport.metronome; e.currentTarget.setAttribute('aria-pressed', transport.metronome); };
$('#btn-save').onclick = () => { saveProject(project); setDirty(false); };

const ruler = $('#ruler');
const seekFrom = e => { const x = e.clientX - $('#tl-inner').getBoundingClientRect().left; transport.seek(x / BAR_PX * project.beatsPerBar); render(); };
ruler.addEventListener('pointerdown', e => { ruler.setPointerCapture(e.pointerId); seekFrom(e); ruler.onpointermove = seekFrom; });
ruler.addEventListener('pointerup', () => { ruler.onpointermove = null; });
ruler.addEventListener('pointercancel', () => { ruler.onpointermove = null; });

const dlg = $('#dlg-projects'), cdlg = $('#dlg-confirm');
function askConfirm(msg) {
  return new Promise(res => {
    $('#confirm-msg').textContent = msg; cdlg.returnValue = '';
    cdlg.onclose = () => res(cdlg.returnValue === 'ok'); cdlg.showModal();
  });
}
function refreshList() {
  const ul = $('#plist'); ul.replaceChildren();
  const items = listProjects();
  if (!items.length) { const li = document.createElement('li'); li.className = 'none'; li.textContent = 'No hay proyectos guardados.'; ul.append(li); }
  for (const it of items) {
    const li = document.createElement('li'), open = document.createElement('button'), del = document.createElement('button');
    open.className = 'open'; open.textContent = it.name;
    const small = document.createElement('small'); small.textContent = new Date(it.updatedAt).toLocaleString('es'); open.append(small);
    open.onclick = async () => {
      if (dirty && !(await askConfirm('Hay cambios sin guardar. ¿Abrir otro proyecto de todas formas?'))) return;
      const p = loadProject(it.id); if (p) { openProject(p); dlg.close(); }
    };
    del.textContent = 'Borrar'; del.setAttribute('aria-label', 'Borrar ' + it.name);
    del.onclick = async () => {
      if (!(await askConfirm('¿Borrar "' + it.name + '"? No se puede deshacer.'))) return;
      deleteProject(it.id);
      if (it.id === project.id) { const rest = listProjects(); rest.length ? openProject(loadProject(rest[0].id)) : newProject('Proyecto 1'); }
      refreshList();
    };
    li.append(open, del); ul.append(li);
  }
}
$('#proj-name').onclick = () => { refreshList(); dlg.showModal(); };
$('#dlg-close').onclick = () => dlg.close();
$('#form-new').onsubmit = async e => {
  e.preventDefault();
  if (dirty && !(await askConfirm('Hay cambios sin guardar. ¿Crear un proyecto nuevo de todas formas?'))) return;
  newProject($('#new-name').value); $('#new-name').value = ''; dlg.close();
};

const last = lastProjectId();
const first = last && loadProject(last);
first ? openProject(first) : newProject('Proyecto 1');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});

</script>
</body>
</html>
